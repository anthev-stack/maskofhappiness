<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MASK OF HAPPINESS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #121212;
            color: #FFFFFF;
            line-height: 1.6;
            padding: 0;
            margin: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
        }

        h1 {
            font-family: 'Noto Serif JP', serif;
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 10px;
            background: white;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #B3B3B3;
            font-size: 1.2rem;
            font-weight: 300;
        }

        .playlists-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .playlist-card {
            background-color: #181818;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s ease;
            border: 1px solid #2a2a2a;
        }

        .playlist-card:hover {
            background-color: #282828;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .playlist-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #FFFFFF;
        }

        .playlist-description {
            color: #B3B3B3;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .spotify-embed {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 15px;
            border: none;
        }

        .follow-button {
            display: inline-block;
            background-color: #1DB954;
            color: #FFFFFF;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 500px;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .follow-button:hover {
            background-color: #1ED760;
            transform: scale(1.05);
        }

        footer {
            text-align: center;
            margin-top: 60px;
            padding-top: 40px;
        }

        .footer-text {
            color: #B3B3B3;
            font-size: 0.9rem;
        }

        .artist-name {
            color: #1DB954;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .playlists-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>MOH</h1>
            <p class="subtitle"></p>
        </header>

        <div class="playlists-grid">
            <!-- MOH 1 -->
            <div class="playlist-card">
                <h2 class="playlist-title">MOH 1</h2>
                <p class="playlist-description">MASK OF HAPPINESS: NOT SO HOUSE</p>
                <iframe 
                    class="spotify-embed"
                    src="https://open.spotify.com/embed/playlist/6DavHeOvotJmTZ9sTlOaZO?utm_source=generator&theme=0" 
                    width="100%" 
                    height="352" 
                    frameBorder="0" 
                    allowfullscreen="" 
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
                    loading="lazy">
                </iframe>
                <a href="https://open.spotify.com/playlist/6DavHeOvotJmTZ9sTlOaZO?si=21CtOdbITaCCwg_CfiX3xA" 
                   target="_blank" 
                   class="follow-button">
                    Follow Playlist
                </a>
            </div>

            <!-- MOH 2 -->
            <div class="playlist-card">
                <h2 class="playlist-title">MOH 2</h2>
                <p class="playlist-description">MASK OF HAPPINESS: MADE FOR PLEASURE</p>
                <iframe 
                    class="spotify-embed"
                    src="https://open.spotify.com/embed/playlist/57ndtv0Bulvi9sNnO8IWky?utm_source=generator&theme=0" 
                    width="100%" 
                    height="352" 
                    frameBorder="0" 
                    allowfullscreen="" 
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
                    loading="lazy">
                </iframe>
                <a href="https://open.spotify.com/playlist/57ndtv0Bulvi9sNnO8IWky?si=0I0QA6bPSU6vHjS4HSxokw" 
                   target="_blank" 
                   class="follow-button">
                    Follow Playlist
                </a>
            </div>

            <!-- MOH 3 -->
            <div class="playlist-card">
                <h2 class="playlist-title">MOH 3</h2>
                <p class="playlist-description">MASK OF HAPPINESS: SHAG A DELIC, YEAH BABY</p>
                <iframe 
                    class="spotify-embed"
                    src="https://open.spotify.com/embed/playlist/5bfKrj23zO0VxMZewRbSxw?utm_source=generator&theme=0" 
                    width="100%" 
                    height="352" 
                    frameBorder="0" 
                    allowfullscreen="" 
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
                    loading="lazy">
                </iframe>
                <a href="https://open.spotify.com/playlist/5bfKrj23zO0VxMZewRbSxw?si=mBF291PNSj2rEqZv8MtQuw" 
                   target="_blank" 
                   class="follow-button">
                    Follow Playlist
                </a>
            </div>
        </div>

        <footer>
            <p class="footer-text"><span class="artist-name">@amaskofhappiness</span></p>
        </footer>
    </div>
</body>
</html>
